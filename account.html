<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinBD Pro | Account</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#222}.wrap{width:min(900px,94vw);margin:40px auto}.top,.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;box-shadow:0 8px 25px rgba(0,0,0,.06);margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:26px;font-weight:800}.logo span{color:#0fa66a}.btn{border:0;border-radius:9px;padding:10px 14px;background:#0b6f45;color:#fff;font-weight:700;cursor:pointer}.btn.alt{background:#374151}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.balance{font-size:38px;font-weight:800;color:#0b6f45;margin:8px 0 0}.muted{color:#6b7280}label{display:block;font-weight:600;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:9px}#msg{margin-top:12px}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div><div class="logo"><span>WINBD</span> PRO</div><div class="muted" id="welcome">Loading…</div></div><div><button class="btn alt" id="homeBtn">Home</button> <button class="btn" id="logout">Logout</button></div></header><section class="grid"><div class="card"><div class="muted">Demo balance</div><div class="balance" id="balance">0.00</div><p class="muted">Demo/testing balance only. No real-money deposits or withdrawals are processed here.</p></div><div class="card"><h3>Request demo adjustment</h3><label>Type</label><select id="type"><option value="demo_credit">Demo credit</option><option value="demo_debit">Demo debit</option></select><label>Amount</label><input id="amount" type="number" min="1" step="0.01" placeholder="100"><label>Note</label><input id="note" maxlength="200" placeholder="Optional note"><button class="btn" style="margin-top:14px" id="request">Submit request</button><div id="msg"></div></div></section><section class="card"><h3>Recent activity</h3><div id="activity" class="rows"><div class="muted">Loading…</div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script>
const s=window.winbdSupabase;let uid;
async function init(){const {data:{user}}=await s.auth.getUser();if(!user){location.href='/login';return}uid=user.id;const {data:p}=await s.from('profiles').select('display_name,username,role').eq('id',uid).single();document.getElementById('welcome').textContent='Welcome, '+(p?.display_name||p?.username||user.phone||'User');await load();}
async function load(){const {data:w}=await s.from('wallets').select('demo_balance').eq('user_id',uid).single();document.getElementById('balance').textContent=Number(w?.demo_balance||0).toFixed(2);const {data:a}=await s.from('activity_log').select('action,metadata,created_at').eq('user_id',uid).order('created_at',{ascending:false}).limit(10);document.getElementById('activity').innerHTML=(a||[]).map(x=>'<div class="row"><span>'+x.action+'</span><span class="muted">'+new Date(x.created_at).toLocaleString()+'</span></div>').join('')||'<div class="muted">No activity yet.</div>';}
document.getElementById('request').onclick=async()=>{const amount=Number(document.getElementById('amount').value),type=document.getElementById('type').value,note=document.getElementById('note').value.trim();if(!amount||amount<=0){document.getElementById('msg').textContent='Enter a valid amount.';return}const {error}=await s.from('admin_requests').insert({user_id:uid,request_type:type,amount,note});document.getElementById('msg').textContent=error?error.message:'Request submitted for admin review.';if(!error)load();};
document.getElementById('logout').onclick=async()=>{await s.auth.signOut();location.href='/login'};document.getElementById('homeBtn').onclick=()=>location.href='/';init();</script></body></html>
