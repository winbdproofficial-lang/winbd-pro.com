<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>WinBD Pro | Register</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#27100e,#050505 48%);color:#fff;display:grid;place-items:center;padding:20px}.shell{width:min(440px,100%)}.brand{text-align:center;margin-bottom:16px}.brand img{width:170px;height:120px;object-fit:contain}.card{background:linear-gradient(180deg,rgba(25,25,25,.98),rgba(8,8,8,.98));border:1px solid #343434;border-radius:22px;padding:26px;box-shadow:0 20px 70px #000}.title{font-size:26px;font-weight:800;text-align:center;margin:0}.sub{text-align:center;color:#aaa;margin:7px 0 24px}label{display:block;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border:1px solid #3c3c3c;border-radius:12px;background:#151515;color:#fff;font-size:16px;outline:none}input:focus{border-color:#e31b16;box-shadow:0 0 0 3px #e31b1625}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:20px;background:linear-gradient(90deg,#c90000,#f12a20);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.links{text-align:center;color:#aaa;margin-top:18px}.links a,.back{color:#ffd21c;text-decoration:none;font-weight:700}.back{display:block;text-align:center;margin-top:14px}.msg{text-align:center;min-height:20px;margin-top:12px;color:#ff827c;font-size:14px}.hint{font-size:12px;color:#777;text-align:center;margin-top:15px;line-height:1.5}</style></head><body><main class="shell"><div class="brand"><img src="/assets/winbd-pro-logo.svg" alt="WINBD PRO"></div><section class="card"><h1 class="title">অ্যাকাউন্ট তৈরি করুন</h1><p class="sub">শুধু নাম, মোবাইল নম্বর ও পাসওয়ার্ড</p><form id="form"><label for="name">নাম</label><input id="name" autocomplete="name" placeholder="আপনার নাম" required><label for="phone">মোবাইল নম্বর</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="new-password" placeholder="কমপক্ষে 6 অক্ষর" minlength="6" required><button class="btn" id="btn">নিবন্ধন করুন</button><div class="msg" id="msg"></div></form><div class="links">আগেই অ্যাকাউন্ট আছে? <a href="/login">প্রবেশ করুন</a></div><a class="back" href="/">← হোমে ফিরে যান</a><div class="hint">এই পেজে OTP, জন্মতারিখ বা আলাদা terms checkbox নেই।</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script>const s=window.winbdSupabase,form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');const phone=v=>{v=v.trim().replace(/\s+/g,'');return /^01\d{9}$/.test(v)?'+88'+v:v};form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='অ্যাকাউন্ট তৈরি হচ্ছে…';msg.textContent='';const p=phone(document.getElementById('phone').value),pw=document.getElementById('password').value,name=document.getElementById('name').value.trim();if(!/^\+8801\d{9}$/.test(p)){msg.textContent='সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন।';btn.disabled=false;btn.textContent='নিবন্ধন করুন';return}const {data,error}=await s.auth.signUp({phone:p,password:pw,options:{data:{full_name:name}}});if(error){msg.textContent=error.message.includes('already')?'এই নম্বর দিয়ে আগে অ্যাকাউন্ট আছে।':'নিবন্ধন করা যায়নি।';btn.disabled=false;btn.textContent='নিবন্ধন করুন';return}if(data.session){location.href='/account';return}const login=await s.auth.signInWithPassword({phone:p,password:pw});if(!login.error){location.href='/account';return}msg.textContent='অ্যাকাউন্ট তৈরি হয়েছে। Supabase Auth-এ phone confirmation বন্ধ থাকলে সরাসরি প্রবেশ হবে।';btn.disabled=false;btn.textContent='নিবন্ধন করুন'});</script></body></html>
