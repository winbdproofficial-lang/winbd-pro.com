<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinBD Pro | Register</title>
<meta name="description" content="WinBD Pro registration page.">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#222}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}.logo span{color:#0fa66a}.sub{text-align:center;color:#6b7280;margin:0 0 25px}label{display:block;font-weight:600;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#0fa66a;box-shadow:0 0 0 3px rgba(15,166,106,.12)}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:22px;background:#0b6f45;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:hover{background:#095c3a}button:disabled{opacity:.6;cursor:wait}.links{text-align:center;margin-top:18px}.links a{color:#0b6f45;text-decoration:none}.back{display:block;text-align:center;margin-top:12px;color:#666;text-decoration:none;font-size:14px}.note{font-size:12px;color:#777;margin-top:14px;text-align:center}#msg{margin-top:12px;text-align:center;font-size:14px;color:#b42318}</style>
</head>
<body><main class="card"><div class="logo"><span>WINBD</span> PRO</div><p class="sub">Create your account</p>
<form id="registerForm"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" maxlength="80" required><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+8801XXXXXXXXX" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="8" required><button id="submitBtn" type="submit">Register</button><div id="msg" role="status"></div></form>
<div class="links">Already have an account? <a href="/login">Login</a></div><a class="back" href="/">← Back to WinBD Pro</a><p class="note">Only your name is stored in your profile. Authentication credentials are handled by Supabase Auth.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script>
<script>
const client=window.winbdSupabase;
const form=document.getElementById('registerForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');
function phoneValue(v){v=v.trim().replace(/\s+/g,''); if(/^01\d{9}$/.test(v)) return '+88'+v; return v;}
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';btn.disabled=true;btn.textContent='Creating…';
 const name=document.getElementById('name').value.trim(),phone=phoneValue(document.getElementById('phone').value),password=document.getElementById('password').value;
 const {data,error}=await client.auth.signUp({phone,password,options:{data:{display_name:name}}});
 if(error){msg.textContent=error.message;btn.disabled=false;btn.textContent='Register';return;}
 if(data.session){location.href='/';return;}
 msg.style.color='#087443';msg.textContent='Account created. If phone verification is enabled, complete verification before logging in.';btn.disabled=false;btn.textContent='Register';
});
</script></body></html>
