<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WinBD Pro | Login</title>
<meta name="description" content="WinBD Pro login page.">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#222}.card{width:min(420px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.logo{text-align:center;font-size:30px;font-weight:800;margin-bottom:8px}.logo span{color:#0fa66a}.sub{text-align:center;color:#6b7280;margin:0 0 25px}label{display:block;font-weight:600;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#0fa66a;box-shadow:0 0 0 3px rgba(15,166,106,.12)}button{width:100%;border:0;border-radius:10px;padding:14px;margin-top:22px;background:#0b6f45;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:hover{background:#095c3a}.links{text-align:center;margin-top:18px}.links a{color:#0b6f45;text-decoration:none}.back{display:block;text-align:center;margin-top:12px;color:#666;text-decoration:none;font-size:14px}.note{font-size:12px;color:#777;margin-top:14px;text-align:center}#msg{margin-top:12px;text-align:center;font-size:14px}</style>
</head><body><main class="card"><div class="logo"><span>WINBD</span> PRO</div><p class="sub">Login to your account</p><form id="loginForm"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required><button type="submit">Login</button><div id="msg"></div></form><div class="links">Don't have an account? <a href="/register">Register</a></div><a class="back" href="/">← Back to WinBD Pro</a><p class="note">Authentication will be connected to the approved backend later. Never enter sensitive credentials on an untrusted page.</p></main><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Backend authentication is not connected yet.'});</script></body></html>
