<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINBD-PRO Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>body{margin:0;background:#07110f;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}.wrap{width:min(1100px,94vw);margin:25px auto}.top,.card{background:#0d1917;border:1px solid #1d3833;border-radius:16px;padding:20px;box-shadow:0 8px 25px #0006;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900}.logo span{color:#5eead4}.muted{color:#9fb6b1}.btn{border:0;border-radius:8px;padding:9px 12px;color:#04120f;background:#5eead4;font-weight:800;cursor:pointer}.btn.reject{background:#fca5a5}.btn:disabled{opacity:.5}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #21342f;vertical-align:top}.news-grid{display:grid;gap:10px}.news-grid input,.news-grid textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #2b4741;background:#07110f;color:#fff}.news-grid textarea{min-height:130px;resize:vertical}.status{font-weight:800}@media(max-width:700px){.top{gap:12px;align-items:flex-start;flex-direction:column}.table{font-size:12px}}</style></head><body><div class="wrap"><header class="top"><div><div class="logo"><span>WINBD</span>-PRO</div><div class="muted">Admin Control Panel</div></div><div><button class="btn" onclick="location.href='/'">Home</button> <button class="btn reject" id="logout">Logout</button></div></header><section class="card"><div id="msg" class="muted">Checking admin access…</div></section><section class="card"><h3>Telegram News</h3><div class="news-grid"><input id="newsTitle" placeholder="News title"><textarea id="newsBody" placeholder="Write announcement/news for Telegram channel"></textarea><button class="btn" id="publishBtn" onclick="publishTelegram()">Telegram-এ Publish করুন</button><div id="telegramMsg" class="muted"></div></div></section><section class="card"><h3>Demo wallet requests</h3><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>const s=window.winbdSupabase;let me;async function init(){if(!s){document.getElementById('msg').textContent='Supabase configuration missing.';return}const {data:{user}}=await s.auth.getUser();if(!user){location.href='/login';return}me=user;const {data:p,error}=await s.from('profiles').select('role').eq('id',user.id).single();if(error||p?.role!=='admin'){document.getElementById('msg').textContent='Access denied.';return}document.getElementById('msg').textContent='Admin access granted.';load()}async function load(){const {data,error}=await s.from('admin_requests').select('id,user_id,request_type,amount,status,created_at,note').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('rows').innerHTML='<tr><td colspan="7">'+error.message+'</td></tr>';return}document.getElementById('rows').innerHTML=(data||[]).map(r=>'<tr><td>'+r.id+'</td><td>'+r.user_id.slice(0,8)+'…</td><td>'+r.request_type+'</td><td>'+Number(r.amount).toFixed(2)+'</td><td class="status">'+r.status+'</td><td>'+new Date(r.created_at).toLocaleString()+'</td><td>'+(r.status==='pending'?'<button class="btn" onclick="review('+r.id+',true)">Approve</button> <button class="btn reject" onclick="review('+r.id+',false)">Reject</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="7">No requests.</td></tr>'}async function review(id,approve){const note=approve?'Approved by admin':'Rejected by admin';const {error}=await s.rpc('review_demo_wallet_request',{p_request_id:id,p_approve:approve,p_note:note});document.getElementById('msg').textContent=error?error.message:'Request updated.';if(!error)load()}async function publishTelegram(){const title=document.getElementById('newsTitle').value.trim();const body=document.getElementById('newsBody').value.trim();const out=document.getElementById('telegramMsg');if(!body){out.textContent='Message লিখুন.';return}const btn=document.getElementById('publishBtn');btn.disabled=true;out.textContent='Publishing…';try{const token=(window.winbdConfig&&window.winbdConfig.supabaseAnonKey)||null;const {data:{session}}=await s.auth.getSession();if(!session)throw new Error('Admin session expired.');const r=await fetch('https://jgdsxhjtepwraxdxvyol.supabase.co/functions/v1/telegram-publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({title,body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||j.message||'Telegram publish failed');out.textContent='Published to Telegram channel.';document.getElementById('newsTitle').value='';document.getElementById('newsBody').value=''}catch(e){out.textContent=e.message||'Publish failed.'}finally{btn.disabled=false}}document.getElementById('logout').onclick=async()=>{await s.auth.signOut();location.href='/login'};init();</script></body></html>
