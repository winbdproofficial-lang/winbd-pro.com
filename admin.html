<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINBD-PRO Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<style>
:root{--bg:#07110f;--panel:#0d1917;--panel2:#10211e;--line:#1d3833;--text:#f5fffd;--muted:#91aaa4;--accent:#5eead4;--danger:#fca5a5;--warn:#fcd34d}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06110f,#0a1715 55%,#07110f);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}.layout{min-height:100vh;display:flex}.side{width:250px;background:#091512;border-right:1px solid var(--line);padding:22px 16px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:10px;align-items:center;margin-bottom:28px}.brand b{font-size:20px}.brand span{display:block;color:var(--accent);font-size:11px;letter-spacing:1.5px}.logo{font-weight:950;font-size:24px;color:var(--accent)}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:left;background:transparent;color:#d9ebe7;border:1px solid transparent;padding:12px 13px;border-radius:10px;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--accent)}.side-note{margin-top:30px;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.side-note b{display:block;color:#fff;margin-bottom:5px}.logout{position:absolute;bottom:20px;left:16px;right:16px;padding:11px;border:1px solid #543434;background:#281817;color:#ffd5d5;border-radius:10px;font-weight:800;cursor:pointer}.main{margin-left:250px;width:calc(100% - 250px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);margin:0 0 5px}.top h1{margin:0;font-size:28px}.admin-name{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(13,25,23,.94);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 35px #0003}.stat{font-size:26px;font-weight:900;margin-top:7px}.label{color:var(--muted);font-size:12px}.section-title{margin:0 0 14px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #203630;font-size:13px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--accent);color:#04120f;font-weight:850;cursor:pointer}.btn.secondary{background:#18302b;color:#dff8f3;border:1px solid var(--line)}.btn.danger{background:var(--danger)}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;background:#07110f;color:#fff;border:1px solid #2b4741;border-radius:10px;padding:12px;font:inherit}.form textarea{min-height:130px;resize:vertical}.status{font-weight:800}.muted{color:var(--muted)}.hidden{display:none}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}.login-card h1{margin:8px 0}.login-card form{display:grid;gap:12px}.login-card input{padding:13px;border-radius:10px;border:1px solid var(--line);background:#07110f;color:#fff}.toast{position:fixed;right:18px;bottom:18px;background:#10211e;border:1px solid var(--line);padding:12px 15px;border-radius:10px;display:none;z-index:20}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#18302b;color:#bcebe3;font-size:11px}.danger-text{color:#fca5a5}
@media(max-width:900px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.layout{display:block}.side{position:static;width:100%;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,1fr)}.logout{position:static;width:100%;margin-top:12px}.main{margin:0;width:100%;padding:15px}.top{align-items:flex-start;gap:10px;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.stat{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">WINBD</div><h1>WINBD-PRO</h1><p class="muted">Admin Control Panel</p>
    <form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button class="btn">Sign in</button><div id="loginMsg" class="muted"></div></form>
  </div>
</div>
<div id="panel" class="layout hidden">
  <aside class="side">
    <div class="brand"><div class="logo">W</div><div><b>WINBD-PRO</b><span>CONTROL PANEL</span></div></div>
    <div class="nav">
      <button class="active" data-page="dashboard">⌂ Dashboard</button>
      <button data-page="users">◉ Users</button>
      <button data-page="requests">▣ Requests</button>
      <button data-page="telegram">📢 Telegram News</button>
      <button data-page="provider">◈ Provider Status</button>
      <button data-page="audit">≡ Audit Logs</button>
      <button data-page="rewards">🎁 Rewards</button>
    </div>
    <div class="side-note"><b>System</b><span>Admin authentication enabled.</span><br><small>Live-money provider operations remain server/provider controlled.</small></div>
    <button class="logout" id="logout">Sign out</button>
  </aside>
  <main class="main">
    <header class="top"><div><p class="eyebrow">WINBD-PRO / ADMIN</p><h1 id="title">Dashboard</h1></div><div id="adminName" class="admin-name"></div></header>
    <section id="content"></section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
const s=window.winbdSupabase;let me=null;
const $=id=>document.getElementById(id);
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}
async function init(){if(!s){$('loginMsg').textContent='Supabase configuration missing.';return}const {data:{user}}=await s.auth.getUser();if(user){const {data:p}=await s.from('profiles').select('role').eq('id',user.id).single();if(p?.role==='admin')return showPanel(user)} }
async function showPanel(user){me=user;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('adminName').textContent=user.email||'Admin';loadPage('dashboard')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Signing in…';const {data,error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}const {data:p}=await s.from('profiles').select('role').eq('id',data.user.id).single();if(p?.role!=='admin'){await s.auth.signOut();$('loginMsg').textContent='Access denied: admin account required.';return}showPanel(data.user)});
$('logout').onclick=async()=>{await s.auth.signOut();location.reload()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');loadPage(b.dataset.page)});
async function loadPage(page){const titles={dashboard:'Dashboard',users:'Users',requests:'Requests',telegram:'Telegram News',provider:'Provider Status',audit:'Audit Logs',rewards:'Rewards'};$('title').textContent=titles[page]||'Dashboard';if(page==='dashboard')return dashboard();if(page==='users')return users();if(page==='requests')return requests();if(page==='telegram')return telegram();if(page==='provider')return provider();if(page==='audit')return audit();if(page==='rewards')return rewards()}
async function dashboard(){let usersCount='—',reqCount='—';try{const a=await s.from('profiles').select('id',{count:'exact',head:true});usersCount=a.count??0;const b=await s.from('admin_requests').select('id',{count:'exact',head:true}).eq('status','pending');reqCount=b.count??0}catch(e){}$('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Users</div><div class="stat">${usersCount}</div></div><div class="card"><div class="label">Pending Requests</div><div class="stat">${reqCount}</div></div><div class="card"><div class="label">Telegram</div><div class="stat">Ready</div></div><div class="card"><div class="label">Provider</div><div class="stat">Sandbox</div></div></div><div class="card"><h3 class="section-title">Quick Actions</h3><button class="btn" onclick="loadPage('telegram')">Publish Telegram News</button> <button class="btn secondary" onclick="loadPage('users')">View Users</button></div>`}
async function users(){const {data,error}=await s.from('profiles').select('id,email,role,created_at').order('created_at',{ascending:false}).limit(100);$('content').innerHTML=`<div class="card"><h3 class="section-title">Users</h3><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody>${error?`<tr><td colspan="4">${error.message}</td></tr>`:(data||[]).map(x=>`<tr><td>${x.id.slice(0,10)}…</td><td>${x.email||'—'}</td><td><span class="pill">${x.role||'user'}</span></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4">No users.</td></tr>'}</tbody></table></div></div>`}
async function requests(){const {data,error}=await s.from('admin_requests').select('id,user_id,request_type,amount,status,created_at,note').order('created_at',{ascending:false}).limit(100);$('content').innerHTML=`<div class="card"><h3 class="section-title">Requests</h3><p class="muted">Requests are shown for review/audit. Financial execution must remain in the licensed provider/server workflow.</p><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Created</th></tr></thead><tbody>${error?`<tr><td colspan="6">${error.message}</td></tr>`:(data||[]).map(x=>`<tr><td>${x.id}</td><td>${x.user_id.slice(0,8)}…</td><td>${x.request_type}</td><td>${Number(x.amount||0).toFixed(2)}</td><td>${x.status}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6">No requests.</td></tr>'}</tbody></table></div></div>`}
function telegram(){$('content').innerHTML=`<div class="card"><h3 class="section-title">Telegram News</h3><p class="muted">Publish an announcement to <b>@winprofficial</b> using the server-side bot integration.</p><div class="form"><input id="newsTitle" placeholder="News title"><textarea id="newsBody" placeholder="Write announcement/news"></textarea><button class="btn" id="pub" onclick="publishTelegram()">Publish to Telegram</button><div id="tgmsg" class="muted"></div></div></div>`}
async function publishTelegram(){const title=$('newsTitle').value.trim(),body=$('newsBody').value.trim();if(!body)return $('tgmsg').textContent='Message লিখুন.';$('pub').disabled=true;$('tgmsg').textContent='Publishing…';try{const {data:{session}}=await s.auth.getSession();if(!session)throw Error('Admin session expired.');const r=await fetch('https://jgdsxhjtepwraxdxvyol.supabase.co/functions/v1/telegram-publish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({title,body})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||j.message||'Telegram publish failed');$('tgmsg').textContent='Published successfully.';toast('Telegram message published');$('newsTitle').value='';$('newsBody').value=''}catch(e){$('tgmsg').textContent=e.message||'Publish failed.'}finally{$('pub').disabled=false}}
function provider(){$('content').innerHTML=`<div class="grid"><div class="card"><div class="label">Game Provider</div><div class="stat">Interface Ready</div><p class="muted">Connect a licensed provider server-side.</p></div><div class="card"><div class="label">Payment</div><div class="stat">Sandbox</div><p class="muted">Test integration only.</p></div><div class="card"><div class="label">Telegram</div><div class="stat">Configured</div><p class="muted">Bot publishing endpoint configured.</p></div><div class="card"><div class="label">Database</div><div class="stat">Supabase</div><p class="muted">Connected through the existing client.</p></div></div>`}
async function audit(){let data=null,error=null;try{({data,error}=await s.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(100))}catch(e){error=e}$('content').innerHTML=`<div class="card"><h3 class="section-title">Audit Logs</h3><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>User</th><th>Details</th></tr></thead><tbody>${error?`<tr><td colspan="4">${error.message||'Audit table unavailable.'}</td></tr>`:(data||[]).map(x=>`<tr><td>${x.created_at?new Date(x.created_at).toLocaleString():'—'}</td><td>${x.action||'—'}</td><td>${x.user_id?String(x.user_id).slice(0,8)+'…':'—'}</td><td>${x.details||x.note||'—'}</td></tr>`).join('')||'<tr><td colspan="4">No audit entries.</td></tr>'}</tbody></table></div></div>`}
function rewards(){$('content').innerHTML=`<div class="card"><h3 class="section-title">Rewards / Bonus Configuration</h3><p class="muted">Reward rules can be displayed and configured here. Actual balance/financial crediting should be performed only by the authorized server/provider workflow.</p><div class="grid"><div class="card"><div class="label">Registration reward</div><div class="stat">Configured</div></div><div class="card"><div class="label">Phone verification</div><div class="stat">Configured</div></div><div class="card"><div class="label">Email verification</div><div class="stat">Configured</div></div><div class="card"><div class="label">Profile completion</div><div class="stat">Configured</div></div></div></div>`}
init();
</script>
</body>
</html>
