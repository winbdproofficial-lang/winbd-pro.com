<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinBD Pro | Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#222}.wrap{width:min(1100px,94vw);margin:35px auto}.top,.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.06);margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:800}.logo span{color:#0fa66a}.muted{color:#6b7280}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}.btn{border:0;border-radius:8px;padding:8px 11px;color:#fff;background:#0b6f45;font-weight:700;cursor:pointer}.btn.reject{background:#b42318}.btn:disabled{opacity:.5}.status{font-weight:700}@media(max-width:700px){.table{font-size:12px}.top{gap:12px;align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div><div class="logo"><span>WINBD</span> PRO</div><div class="muted">Admin · Demo wallet management</div></div><div><button class="btn" onclick="location.href='/'">Home</button> <button class="btn reject" id="logout">Logout</button></div></header><section class="card"><div id="msg" class="muted">Checking admin access…</div></section><section class="card"><h3>Demo wallet requests</h3><div style="overflow:auto"><table class="table"><thead><tr><th>ID</th><th>User</th><th>Type</th><th>Amount</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase.js"></script><script>
const s=window.winbdSupabase;let me;
async function init(){const {data:{user}}=await s.auth.getUser();if(!user){location.href='/login';return}me=user;const {data:p,error}=await s.from('profiles').select('role').eq('id',user.id).single();if(error||p?.role!=='admin'){document.getElementById('msg').textContent='Access denied.';return}document.getElementById('msg').textContent='Admin access granted.';load();}
async function load(){const {data,error}=await s.from('admin_requests').select('id,user_id,request_type,amount,status,created_at,note').order('created_at',{ascending:false}).limit(100);if(error){document.getElementById('rows').innerHTML='<tr><td colspan="7">'+error.message+'</td></tr>';return}document.getElementById('rows').innerHTML=(data||[]).map(r=>'<tr><td>'+r.id+'</td><td>'+r.user_id.slice(0,8)+'…</td><td>'+r.request_type+'</td><td>'+Number(r.amount).toFixed(2)+'</td><td class="status">'+r.status+'</td><td>'+new Date(r.created_at).toLocaleString()+'</td><td>'+ (r.status==='pending'?'<button class="btn" onclick="review('+r.id+',true)">Approve</button> <button class="btn reject" onclick="review('+r.id+',false)">Reject</button>':'—')+'</td></tr>').join('')||'<tr><td colspan="7">No requests.</td></tr>';}
async function review(id,approve){const note=approve?'Approved by admin':'Rejected by admin';const {error}=await s.rpc('review_demo_wallet_request',{p_request_id:id,p_approve:approve,p_note:note});document.getElementById('msg').textContent=error?error.message:'Request updated.';if(!error)load();}
document.getElementById('logout').onclick=async()=>{await s.auth.signOut();location.href='/login'};init();</script></body></html>
